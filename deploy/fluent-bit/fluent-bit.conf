# Fluent Bit is deliberately a transport agent, not the source of truth.
# PostgreSQL and the existing service-log APIs remain authoritative.
[SERVICE]
    Flush                     1
    Grace                     30
    Log_Level                 warn
    storage.path              /var/fluent-bit/state
    storage.sync              normal
    storage.checksum          off
    storage.max_chunks_up     32
    storage.backlog.mem_limit 32M

[INPUT]
    Name                      forward
    Unix_Path                 ${LOG_FORWARD_SOCKET_PATH}
    Unix_Perm                 0660
    Buffer_Chunk_Size         256K
    Buffer_Max_Size           8M
    storage.type              filesystem
    storage.pause_on_chunks_overlimit off

[OUTPUT]
    Name                      http
    Match                     *
    Host                      ${LOG_INGEST_HOST}
    Port                      ${LOG_INGEST_PORT}
    TLS                       ${LOG_INGEST_TLS}
    URI                       /services/internal/logs/ingest/
    Format                    json_lines
    Json_Date_Key             timestamp
    Json_Date_Format          iso8601
    Header                    Content-Type application/x-ndjson
    Header                    X-PassDeployer-Token ${LOG_INGEST_SHARED_TOKEN}
    Header                    X-PassDeployer-Collector ${LOG_COLLECTOR_ID}
    Compress                  gzip
    Workers                   1
    Retry_Limit               False
    storage.total_limit_size  ${LOG_COLLECTOR_DISK_LIMIT}
