name: WordPress runtime contract

on:
  push:
    branches: ["master"]
    paths:
      - "src/app_catalog/catalog/first_party/wordpress-with-mariadb.yaml"
      - "src/app_catalog/services.py"
      - "src/deployments/common/deployment_profile.py"
      - "src/deployments/core/platform_bridge.py"
      - "src/deployments/core/runtime_graph.py"
      - "src/deployments/runtime/execution_contract.py"
      - "src/deployments/runtime/swarm/adapter.py"
      - "src/deployments/core/dockerfile.py"
      - "src/deployments/core/swarm.py"
      - "src/deployments/celery/services/deploy_service.py"
      - "src/deployments/tests/test_platform_bridge_regressions.py"
      - "src/deployments/tests/test_execution_contract.py"
      - "src/deployments/tests/test_swarm_runtime.py"
      - "src/app_catalog/tests/integration/test_ready_app_runtime.py"
      - ".github/workflows/wordpress-runtime-contract.yml"
  workflow_dispatch:

jobs:
  wordpress-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install YAML parser
        run: python3 -m pip install --disable-pip-version-check pyyaml

      - name: Render catalog Dockerfile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import yaml

          source = Path("src/app_catalog/catalog/first_party/wordpress-with-mariadb.yaml")
          data = yaml.safe_load(source.read_text())
          dockerfile = data["services"]["wordpress"]["dockerfile"]
          dockerfile = dockerfile.replace("${config.software_version}", "7.1.2")
          dockerfile = dockerfile.replace("${config.php_version}", "8.4")
          health = data["services"]["wordpress"]["healthcheck"]
          test = health["test"]
          command = " ".join(str(x) for x in test[1:]) if test[0] == "CMD-SHELL" else ""
          interval = str(health.get("interval") or "5s")
          timeout = str(health.get("timeout") or "10s")
          start_period = str(health.get("start_period") or "60s")
          retries = int(health.get("retries") or 36)
          dockerfile = (
              dockerfile.rstrip()
              + f"\nHEALTHCHECK --interval={interval} --timeout={timeout} "
                f"--start-period={start_period} --retries={retries} CMD {command}\n"
          )
          build_context = Path("/tmp/wordpress-build-context")
          build_context.mkdir(parents=True, exist_ok=True)
          (build_context / "Dockerfile").write_text(dockerfile)
          files = data["services"]["wordpress"].get("files") or {}
          for name, content in files.items():
              target = build_context / str(name)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(str(content))
          print(dockerfile)
          print("Build-context files:", sorted(str(name) for name in files))
          PY

      - name: Build WordPress image
        run: docker build --pull -f /tmp/wordpress-build-context/Dockerfile -t passdeployer-wordpress-contract:test /tmp/wordpress-build-context

      - name: Assert image command contract
        run: |
          set -eux
          ENTRYPOINT_JSON="$(docker image inspect passdeployer-wordpress-contract:test --format '{{json .Config.Entrypoint}}')"
          CMD_JSON="$(docker image inspect passdeployer-wordpress-contract:test --format '{{json .Config.Cmd}}')"
          test "$ENTRYPOINT_JSON" = '["/usr/local/bin/docker-ensure-installed.sh"]'
          test "$CMD_JSON" = '["/usr/local/bin/passdeployer-wordpress-entrypoint.sh","/usr/local/bin/apache2-foreground"]'

      - name: Assert WordPress uses the official preparation entrypoint
        run: |
          set -eux
          docker run --rm --entrypoint sh passdeployer-wordpress-contract:test -c             'test "$(readlink -f /usr/local/bin/docker-ensure-installed.sh)" = "/usr/local/bin/docker-entrypoint.sh"'
          docker run --rm --entrypoint sh passdeployer-wordpress-contract:test -c             '! grep -Fq "docker-ensure-installed.sh true" /usr/local/bin/passdeployer-wordpress-entrypoint.sh'

      - name: Run MariaDB and WordPress
        run: |
          set -eux
          docker network create passdeployer-wp-contract

          docker run -d --name passdeployer-wp-db \
            --network passdeployer-wp-contract \
            -e MARIADB_ROOT_PASSWORD=root-contract-password \
            -e MARIADB_DATABASE=wordpress \
            -e MARIADB_USER=app \
            -e MARIADB_PASSWORD=app-contract-password \
            mariadb:11.8.9

          docker run -d --name passdeployer-wp \
            --network passdeployer-wp-contract \
            -e WORDPRESS_DB_HOST=passdeployer-wp-db \
            -e WORDPRESS_DB_USER=app \
            -e WORDPRESS_DB_PASSWORD=app-contract-password \
            -e WORDPRESS_DB_NAME=wordpress \
            -e WORDPRESS_TABLE_PREFIX=wp_ \
            -e WORDPRESS_SITE_URL=http://127.0.0.1:18080 \
            -e WORDPRESS_SITE_TITLE="Contract Test Site" \
            -e WORDPRESS_ADMIN_USER=contract-admin \
            -e WORDPRESS_ADMIN_PASSWORD="contract-admin-password-123" \
            -e WORDPRESS_ADMIN_EMAIL=contract@example.invalid \
            -e WORDPRESS_LOCALE=en_US \
            -e WORDPRESS_TIMEZONE=UTC \
            -e WORDPRESS_PERMALINK_STRUCTURE="/%postname%/" \
            -e WORDPRESS_AUTO_INSTALL=1 \
            -e WORDPRESS_MANAGED_CRON=0 \
            -e WORDPRESS_CRON_INTERVAL=300 \
            -e WORDPRESS_CONFIG_EXTRA="define( 'WP_HOME', 'http://127.0.0.1:18080' ); define( 'WP_SITEURL', 'http://127.0.0.1:18080' );" \
            -v passdeployer-wp-files:/var/www/html \
            -p 18080:80 \
            passdeployer-wordpress-contract:test

      - name: Inspect WordPress runtime process
        run: |
          set -eux
          docker inspect -f 'Path={{json .Path}} Args={{json .Args}} Entrypoint={{json .Config.Entrypoint}} Cmd={{json .Config.Cmd}}' passdeployer-wp
          docker exec passdeployer-wp sh -c 'printf "pid1="; tr "\\0" " " </proc/1/cmdline; echo; printf "script="; ls -l /usr/local/bin/passdeployer-wordpress-entrypoint.sh; head -n 3 /usr/local/bin/passdeployer-wordpress-entrypoint.sh'
          docker exec passdeployer-wp sh -c 'test -f /tmp/passdeployer-wordpress-ready; echo ready_marker=$?'
          docker logs passdeployer-wp || true

      - name: Wait for WordPress health
        run: |
          set -eu
          for i in $(seq 1 180); do
            status="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' passdeployer-wp)"
            echo "health=$status attempt=$i"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            if [ "$status" = "unhealthy" ]; then
              docker logs passdeployer-wp || true
              exit 1
            fi
            sleep 1
          done
          docker logs passdeployer-wp || true
          docker inspect passdeployer-wp || true
          exit 1

      - name: Run native runtime contract regressions
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          SECRET_KEY: ci-only-secret
          DOMAIN_NAME: localhost
          API_DOMAIN_NAME: localhost
          DB_NAME: paas_ci
          DB_USER: paas_ci
          DB_PASSWORD: paas_ci
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -r requirements.txt
          pytest -q src/deployments/tests/test_execution_contract.py src/deployments/tests/test_swarm_runtime.py

      - name: Assert WP-CLI installation completed
        run: |
          set -euo pipefail
          logs="$(docker logs passdeployer-wp)"
          install_line="$(printf '%s\n' "$logs" | grep -nF "[passdeployer-wordpress] Installing WordPress through WP-CLI..." | head -n1 | cut -d: -f1)"
          ready_line="$(printf '%s\n' "$logs" | grep -nF "[passdeployer-wordpress] WordPress installation is ready." | head -n1 | cut -d: -f1)"
          start_line="$(printf '%s\n' "$logs" | grep -nF "[passdeployer-wordpress] Starting WordPress foreground command:" | head -n1 | cut -d: -f1)"
          apache_line="$(printf '%s\n' "$logs" | grep -nF "Apache/2." | grep -F "resuming normal operations" | head -n1 | cut -d: -f1)"
          test -n "$install_line"
          test -n "$ready_line"
          test -n "$start_line"
          test -n "$apache_line"
          test "$install_line" -lt "$ready_line"
          test "$ready_line" -lt "$start_line"
          test "$start_line" -lt "$apache_line"
          docker exec passdeployer-wp wp core is-installed --allow-root
          docker exec passdeployer-wp wp option get blogname --allow-root

      - name: Run WordPress through single-node Swarm
        if: always()
        run: |
          set -euxo pipefail
          docker swarm init --advertise-addr 127.0.0.1

          docker network create --driver overlay --attachable passdeployer-wp-swarm
          docker volume create passdeployer-wp-swarm-files
          docker volume create passdeployer-wp-swarm-db

          docker service create             --name passdeployer-wp-swarm-db             --network passdeployer-wp-swarm             --mount type=volume,source=passdeployer-wp-swarm-db,target=/var/lib/mysql             --env MARIADB_ROOT_PASSWORD=root-swarm-password             --env MARIADB_DATABASE=wordpress             --env MARIADB_USER=app             --env MARIADB_PASSWORD=app-swarm-password             mariadb:11.8.9

          for i in $(seq 1 120); do
            db_state="$(docker service ps --no-trunc --format '{{.CurrentState}}' passdeployer-wp-swarm-db | head -n1)"
            echo "db_state=$db_state"
            if echo "$db_state" | grep -q "Running"; then
              break
            fi
            sleep 1
          done

          docker service create             --name passdeployer-wp-swarm             --network passdeployer-wp-swarm             --mount type=volume,source=passdeployer-wp-swarm-files,target=/var/www/html             --env WORDPRESS_DB_HOST=passdeployer-wp-swarm-db             --env WORDPRESS_DB_USER=app             --env WORDPRESS_DB_PASSWORD=app-swarm-password             --env WORDPRESS_DB_NAME=wordpress             --env WORDPRESS_TABLE_PREFIX=wp_             --env WORDPRESS_SITE_URL=http://127.0.0.1:18081             --env WORDPRESS_SITE_TITLE="Swarm Contract Site"             --env WORDPRESS_ADMIN_USER=swarm-admin             --env WORDPRESS_ADMIN_PASSWORD="swarm-admin-password-123"             --env WORDPRESS_ADMIN_EMAIL=swarm@example.invalid             --env WORDPRESS_LOCALE=en_US             --env WORDPRESS_TIMEZONE=UTC             --env WORDPRESS_PERMALINK_STRUCTURE="/%postname%/"             --env WORDPRESS_AUTO_INSTALL=1             --env WORDPRESS_MANAGED_CRON=0             --env WORDPRESS_CRON_INTERVAL=300             --env WORDPRESS_CONFIG_EXTRA="define( 'WP_HOME', 'http://127.0.0.1:18081' ); define( 'WP_SITEURL', 'http://127.0.0.1:18081' );"             --health-cmd='test -f /tmp/passdeployer-wordpress-ready && wp core is-installed --allow-root >/dev/null 2>&1'             --health-interval=5s             --health-timeout=10s             --health-start-period=60s             --health-retries=36             --entrypoint /usr/local/bin/docker-ensure-installed.sh             passdeployer-wordpress-contract:test             /usr/local/bin/passdeployer-wordpress-entrypoint.sh /usr/local/bin/apache2-foreground

          for i in $(seq 1 240); do
            state="$(docker service ps --no-trunc --format '{{.CurrentState}}' passdeployer-wp-swarm | head -n1)"
            error="$(docker service ps --no-trunc --format '{{.Error}}' passdeployer-wp-swarm | head -n1 || true)"
            echo "wp_state=$state error=$error"
            if echo "$state" | grep -q "Running"; then
              cid="$(docker ps -q --filter label=com.docker.swarm.service.name=passdeployer-wp-swarm | head -n1)"
              if [ -n "$cid" ]; then
                status="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$cid")"
                echo "health=$status"
                if [ "$status" = "healthy" ]; then
                  docker exec "$cid" wp core is-installed --allow-root
                  docker logs "$cid"
                  exit 0
                fi
              fi
            fi
            sleep 1
          done

          docker service ps --no-trunc passdeployer-wp-swarm || true
          docker service inspect passdeployer-wp-swarm || true
          cid="$(docker ps -aq --filter label=com.docker.swarm.service.name=passdeployer-wp-swarm | head -n1 || true)"
          if [ -n "$cid" ]; then
            docker inspect "$cid" || true
            docker logs "$cid" || true
          fi
          exit 1

  native-swarm-integration:
    name: Native Ready App Swarm integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: paas_ci
          POSTGRES_USER: paas_ci
          POSTGRES_PASSWORD: paas_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U paas_ci -d paas_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DJANGO_SETTINGS_MODULE: config.settings
      SECRET_KEY: ci-only-secret
      DEBUG: "1"
      DOMAIN_NAME: localhost
      API_DOMAIN_NAME: localhost
      DB_NAME: paas_ci
      DB_USER: paas_ci
      DB_PASSWORD: paas_ci
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DEPLOYMENT_LOG_DB_NAME: paas_ci
      DEPLOYMENT_LOG_DB_USER: paas_ci
      DEPLOYMENT_LOG_DB_PASSWORD: paas_ci
      DEPLOYMENT_LOG_DB_HOST: 127.0.0.1
      DEPLOYMENT_LOG_DB_PORT: "5432"
      REDIS_URL: redis://127.0.0.1:6379
      CELERY_BROKER_URL: redis://127.0.0.1:6379
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379
      CHANNEL_REDIS_URL: redis://127.0.0.1:6379
      SWARM_ENABLED: "1"
      RUN_DEPLOYMENT_INTEGRATION: "1"
      PASSDEPLOYER_GIT_SHA: ${{ github.sha }}
      DEPLOYMENT_INTEGRATION_TIMEOUT: "1200"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Django system checks and migrations
        run: |
          python manage.py check
          python manage.py migrate --noinput

      - name: Initialize single-node Swarm
        run: docker swarm init --advertise-addr 127.0.0.1

      - name: Start dedicated deployment worker
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src:$PYTHONPATH"
          nohup celery -A config worker --loglevel=info --pool=solo --concurrency=1 -Q deployments,operations > /tmp/deployment-worker.log 2>&1 &
          echo $! > /tmp/deployment-worker.pid
          for i in $(seq 1 30); do
            if grep -q "ready" /tmp/deployment-worker.log; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/deployment-worker.log
          exit 1

      - name: Run real WordPress Ready App native Swarm integration
        run: |
          set -o pipefail
          pytest -q src/app_catalog/tests/integration/test_ready_app_runtime.py -m deployment_integration -k wordpress_mariadb_real_stack 2>&1 | tee /tmp/native-swarm-test.log
        timeout-minutes: 20

      - name: Dump deployment worker diagnostics on failure
        if: failure()
        run: |
          cat /tmp/deployment-worker.log || true
          docker service ls || true
          docker service ps --no-trunc $(docker service ls -q) || true
