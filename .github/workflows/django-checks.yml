name: Django checks

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  django-checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: paas_ci
          POSTGRES_USER: paas_ci
          POSTGRES_PASSWORD: paas_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U paas_ci -d paas_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      SECRET_KEY: ci-only-secret
      DEBUG: "True"
      DOMAIN_NAME: localhost
      API_DOMAIN_NAME: localhost
      DB_NAME: paas_ci
      DB_USER: paas_ci
      DB_PASSWORD: paas_ci
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DEPLOYMENT_LOG_DB_NAME: paas_ci
      DEPLOYMENT_LOG_DB_USER: paas_ci
      DEPLOYMENT_LOG_DB_PASSWORD: paas_ci
      DEPLOYMENT_LOG_DB_HOST: 127.0.0.1
      DEPLOYMENT_LOG_DB_PORT: "5432"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system checks
        run: python manage.py check

      - name: Auth session regression tests
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          DJANGO_FULL_TESTS: "1"
        run: python manage.py test auth_users.tests_sessions users.tests_admin_sessions --verbosity 2

      - name: Migration drift check
        run: python manage.py makemigrations --check --dry-run --verbosity 2

      - name: Admin model coverage and Wagtail policy regression tests
        run: pytest -q src/core/tests/test_django_admin_coverage.py

      - name: Backend model serializer and API permission matrix
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          DJANGO_FULL_TESTS: "1"
        run: pytest -q src/core/tests/test_backend_contract_matrix.py src/core/tests/test_cache_contracts.py

      - name: Regression tests
        run: pytest -q core/tests/test_wagtail_cache_admin.py deployments/tests/test_deploy_file_upload_regressions.py src/services/tests_shell_backend_regressions.py
      - name: Agent application tests
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          DJANGO_FULL_TESTS: "1"
        run: pytest -q src/agent/tests
