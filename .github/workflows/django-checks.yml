name: Django checks

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  django-checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: paas_ci
          POSTGRES_USER: paas_ci
          POSTGRES_PASSWORD: paas_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U paas_ci -d paas_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      SECRET_KEY: ci-only-secret
      DEBUG: "True"
      DOMAIN_NAME: localhost
      API_DOMAIN_NAME: localhost
      DB_NAME: paas_ci
      DB_USER: paas_ci
      DB_PASSWORD: paas_ci
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DEPLOYMENT_LOG_DB_NAME: paas_ci
      DEPLOYMENT_LOG_DB_USER: paas_ci
      DEPLOYMENT_LOG_DB_PASSWORD: paas_ci
      DEPLOYMENT_LOG_DB_HOST: 127.0.0.1
      DEPLOYMENT_LOG_DB_PORT: "5432"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system checks
        run: python manage.py check

      - name: Auth session regression tests
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          DJANGO_FULL_TESTS: "1"
        run: python manage.py test auth_users.tests_sessions users.tests_admin_sessions --verbosity 2

      - name: Migration drift check
        run: python manage.py makemigrations --check --dry-run --verbosity 2

      - name: Admin model coverage and Wagtail policy regression tests
        run: pytest -q src/core/tests/test_django_admin_coverage.py

      - name: Backend model serializer and API permission matrix
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          DJANGO_FULL_TESTS: "1"
        run: pytest -q src/core/tests/test_backend_contract_matrix.py src/core/tests/test_cache_contracts.py

      - name: Domain model API serializer permission cache tests
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          DJANGO_FULL_TESTS: "1"
        run: >-
          pytest -q
          src/plans/tests/test_models_serializers_api.py
          src/users/tests/test_models_serializers_api.py
          src/auth_users/tests/test_models_admin_api.py
          src/auth_users/tests/test_token_serializers_contracts.py
          src/tickets/tests/test_models_serializers_permissions.py
          src/services/tests/test_model_serializer_cache_contracts.py
          src/deploy/tests/test_model_serializer_contracts.py
          src/app_catalog/tests/test_models_serializer_contracts.py
          src/docs/tests/test_model_api_contracts.py
          src/custom_emails/tests/test_api_serializers.py
          src/logs/tests/test_health_api.py
          src/messenger/tests/test_api_permission_boundary.py
          src/core/tests/test_system_setting_contracts.py
          src/cms/tests/test_models.py

      - name: Full Django non-integration suite
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          DJANGO_FULL_TESTS: "1"
        run: pytest -q -m "not deployment_integration"

      - name: Regression tests
        run: pytest -q core/tests/test_wagtail_cache_admin.py deployments/tests/test_deploy_file_upload_regressions.py src/services/tests_shell_backend_regressions.py
      - name: Agent application tests
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          DJANGO_FULL_TESTS: "1"
        run: pytest -q src/agent/tests
