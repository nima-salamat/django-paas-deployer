name: architecture-validation

on:
  push:
    branches:
      - master
      - refactor/service-centric-runtime
  pull_request:
    branches:
      - master

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate POSIX shell scripts
        run: |
          sh -n scripts/compose.sh
          sh -n scripts/prepare-log-node.sh
          sh -n scripts/deploy-log-agents.sh
          sh -n scripts/migrate-runtime-log-driver.sh
      - name: Validate Docker Compose configurations
        run: |
          cp .env.example .env
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.yaml -f compose.matrix-postgres.yaml config --quiet
      - name: Compile Python sources
        run: |
          python -m compileall -q src

  unit-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: paas_ci
          POSTGRES_USER: paas_ci
          POSTGRES_PASSWORD: paas_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U paas_ci -d paas_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DJANGO_SETTINGS_MODULE: config.settings
      SECRET_KEY: test-secret-key-for-ci
      DEBUG: "1"
      SWARM_ENABLED: "0"
      DB_NAME: paas_ci
      DB_USER: paas_ci
      DB_PASSWORD: paas_ci
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DEPLOYMENT_LOG_DB_NAME: paas_ci
      DEPLOYMENT_LOG_DB_USER: paas_ci
      DEPLOYMENT_LOG_DB_PASSWORD: paas_ci
      DEPLOYMENT_LOG_DB_HOST: 127.0.0.1
      DEPLOYMENT_LOG_DB_PORT: "5432"
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-django
      - name: Validate documentation source coverage
        run: |
          python scripts/validate_documentation.py
      - name: Validate canonical source contract inventory
        run: |
          python scripts/validate_documentation_contracts.py

      - name: Matrix secure-chat regression tests
        run: |
          pytest -q src/messenger/tests/test_matrix_service_config.py src/messenger/tests/test_security_mode.py -k "encrypted_room or secure_dm_is_parallel or encrypted_group_topics_expose_metadata"

      - name: Agent Messenger and Ticket collaboration tests
        run: |
          pytest -q src/agent/tests/test_collaboration.py

      - name: Run unit and regression tests
        run: |
          # Unit/regression suite only. Real Docker/Swarm tests are marked
          # deployment_integration and are not executed in this job.
          pytest -q -m "not deployment_integration" --ignore=scripts

      - name: Run lifecycle hardening contracts
        run: |
          pytest -q deployments/tests/test_lifecycle_hardening_contracts.py
