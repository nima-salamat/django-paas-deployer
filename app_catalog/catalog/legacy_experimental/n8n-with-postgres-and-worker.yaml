# Source pattern: Coolify templates/compose/n8n-with-postgres-and-worker.yaml
name: n8n-with-postgres-and-worker
x-passdeployer:
  id: n8n-with-postgres-and-worker
  name: n8n with PostgreSQL and Worker
  version: "2.10.4"
  category: automation
  tags: [n8n, workflow, automation, queue, worker]
  description: n8n queue-mode deployment with PostgreSQL and Redis.
  source_url: https://github.com/coollabsio/coolify/blob/main/templates/compose/n8n-with-postgres-and-worker.yaml
  public_service: n8n
  fields:
    - id: domain
      label: Domain
      type: domain
      required: true
    - id: postgres_password
      label: PostgreSQL password
      type: secret
      generate: password:32
    - id: encryption_key
      label: n8n encryption key
      type: secret
      generate: password:64
services:
  n8n:
    image: n8nio/n8n:2.10.4
    x-passdeployer:
      role: app
      public: true
      readiness_path: /healthz
    environment:
      N8N_EDITOR_BASE_URL: ${config.domain}
      WEBHOOK_URL: ${config.domain}
      N8N_HOST: ${config.domain}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_HOST: postgresql
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_USER: app
      DB_POSTGRESDB_SCHEMA: public
      DB_POSTGRESDB_PASSWORD: ${secret.postgres_password}
      EXECUTIONS_MODE: queue
      QUEUE_BULL_REDIS_HOST: redis
      N8N_ENCRYPTION_KEY: ${secret.encryption_key}
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - n8n-data:/home/node/.n8n
    expose: [5678]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz"]
      interval: 5s
      timeout: 20s
      retries: 10
  n8n-worker:
    image: n8nio/n8n:2.10.4
    x-passdeployer:
      role: worker
      public: false
    command: [worker]
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_HOST: postgresql
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_USER: app
      DB_POSTGRESDB_SCHEMA: public
      DB_POSTGRESDB_PASSWORD: ${secret.postgres_password}
      EXECUTIONS_MODE: queue
      QUEUE_BULL_REDIS_HOST: redis
      N8N_ENCRYPTION_KEY: ${secret.encryption_key}
    depends_on:
      n8n:
        condition: service_healthy
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - n8n-data:/home/node/.n8n
  postgresql:
    image: postgres:16-alpine
    x-passdeployer:
      role: database
      public: false
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: n8n
    volumes:
      - postgresql-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 20s
      retries: 10
  redis:
    image: redis:6-alpine
    x-passdeployer:
      role: cache
      public: false
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
