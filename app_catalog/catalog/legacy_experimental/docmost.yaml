# Source pattern: Coolify templates/compose/docmost.yaml
name: docmost
x-passdeployer:
  id: docmost
  name: Docmost
  version: "latest"
  category: productivity
  tags: [documentation, wiki, collaboration]
  description: Collaborative wiki and documentation platform.
  source_url: https://github.com/coollabsio/coolify/blob/main/templates/compose/docmost.yaml
  public_service: docmost
  fields:
    - id: domain
      label: Domain
      type: domain
      required: true
    - id: app_secret
      label: Application secret
      type: secret
      generate: password:48
    - id: postgres_password
      label: PostgreSQL password
      type: secret
      generate: password:32
services:
  docmost:
    image: docmost/docmost:latest
    x-passdeployer:
      role: app
      public: true
      readiness_path: /
    environment:
      APP_SECRET: ${APP_SECRET}
      APP_URL: ${config.domain}
      DATABASE_URL: postgresql://app:${secret.postgres_password}@postgresql/docmost?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - docmost-data:/app/data/storage
    expose:
      - 3000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000"]
      interval: 2s
      timeout: 10s
      retries: 20
  postgresql:
    image: postgres:16-alpine
    x-passdeployer:
      role: database
      public: false
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: docmost
    volumes:
      - postgresql-data:/var/lib/postgresql/data
    expose: [5432]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 10s
      retries: 20
  redis:
    image: redis:7.2-alpine
    x-passdeployer:
      role: cache
      public: false
    volumes:
      - redis-data:/data
    expose: [6379]
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 5s
      timeout: 10s
      retries: 20
