# Source pattern: common Coolify PostgreSQL service templates
name: postgresql
x-passdeployer:
  id: postgresql
  name: PostgreSQL
  version: "16-alpine"
  category: database
  tags: [database, postgres, sql]
  description: PostgreSQL relational database.
  source_url: https://github.com/coollabsio/coolify/tree/main/templates/compose
  fields:
    - id: postgres_user
      label: Username
      type: string
      default: app
    - id: postgres_password
      label: Password
      type: secret
      generate: password:32
    - id: postgres_db
      label: Database
      type: string
      default: app
services:
  postgres:
    image: postgres:16-alpine
    x-passdeployer:
      role: database
      public: false
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    expose:
      - 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 20s
      retries: 10
