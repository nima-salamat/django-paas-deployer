# Opt-in Compose overlay selected by scripts/compose.sh when USE_MATRIX_POSTGRES=1.
# It disables only the two local Deployer PostgreSQL services. Synapse and all data volumes
# stay owned by the separate Matrix Compose project and are never changed by this overlay.
services:
  db:
    profiles:
      - matrix-postgres-disabled-in-shared-mode

  deployment-log-db:
    profiles:
      - matrix-postgres-disabled-in-shared-mode

  web:
    depends_on:
      db:
        required: false
      deployment-log-db:
        required: false

  celery:
    depends_on:
      db:
        required: false
      deployment-log-db:
        required: false
    networks:
      - matrix-network

  deployment-worker:
    depends_on:
      db:
        required: false
      deployment-log-db:
        required: false
    networks:
      - matrix-network

  base-image-worker:
    depends_on:
      db:
        required: false
      deployment-log-db:
        required: false
    networks:
      - matrix-network

  celery-beat:
    depends_on:
      db:
        required: false
      deployment-log-db:
        # The base compose file no longer needs the log DB just to run Beat,
        # but keep a valid optional dependency when this overlay is merged.
        condition: service_healthy
        required: false
    networks:
      - matrix-network

  integration-test:
    depends_on:
      db:
        required: false
      deployment-log-db:
        required: false
    networks:
      - matrix-network

