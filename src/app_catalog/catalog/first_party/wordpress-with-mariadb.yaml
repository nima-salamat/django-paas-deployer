# documentation: https://wordpress.org
# slogan: WordPress is open source software you can use to create a beautiful website, blog, or app.
# category: cms
# tags: cms, blog, content, management, mariadb
# logo: svgs/wordpress.svg
# port: 80

x-passdeployer:
  id: wordpress
  name: WordPress
  version: "7.1.2"
  software_version: "7.1.2"
  definition_version: "1.0"
  visibility: public
  featured: true
  features:
    - Managed WordPress application
    - Managed MariaDB database
    - Persistent WordPress storage
    - HTTPS platform address
  requirements:
    - Complete the WordPress setup wizard after deployment
    - Use the platform-provided HTTPS address
  outputs:
    - url
  managed_components:
    - label: WordPress
      role: application
    - label: MariaDB
      role: database
  fields:
    - id: domain
      label: Platform address
      type: domain
      required: false
      user_editable: false
    - id: software_version
      label: WordPress version
      type: choice
      required: true
      default: "7.1.2"
      options:
        - "7.1.2"
        - "7.1.1"
        - "7.1.0"
      option_labels:
        "7.1.2": "7.1.2 — Recommended"
        "7.1.1": "7.1.1 — Previous patch"
        "7.1.0": "7.1.0 — Previous patch"
      ui:
        helper_text: "Choose a pinned official WordPress Docker release. PassDeployer uses the exact selected version."
    - id: service_user_wordpress
      label: WordPress database user
      type: string
      default: app
      user_editable: false
    - id: service_password_wordpress
      label: WordPress database password
      type: secret
      secret: true
      generate: password:32
      user_editable: false
    - id: service_password_root
      label: MariaDB root password
      type: secret
      secret: true
      generate: password:32
      user_editable: false

services:
  wordpress:
    image: wordpress:${config.software_version}-php8.3-apache
    dockerfile: |
      FROM wordpress:${config.software_version}-php8.3-apache
      
      # WP-CLI is part of the Ready App runtime so Agent/Shell can manage
      # pages, plugins, themes and database operations without ad-hoc installs.
      ARG WP_CLI_VERSION=2.12.0
      RUN set -eux; \
          apt-get update; \
          apt-get install -y --no-install-recommends ca-certificates curl; \
          curl -fsSL "https://github.com/wp-cli/wp-cli/releases/download/v${WP_CLI_VERSION}/wp-cli-${WP_CLI_VERSION}.phar" -o /usr/local/bin/wp; \
          echo "fe19025cc113142492a3ca68dd93d20ba4164e5ecb3c0a0d86a9db7e06b917201120763fa2b8256addeaa9cb745b2b8bef8e8d74a697230e30ef681f13e09186  /usr/local/bin/wp" | sha512sum -c -; \
          chmod 0755 /usr/local/bin/wp; \
          wp --info --allow-root; \
          rm -rf /var/lib/apt/lists/*
      ENV WP_CLI_ALLOW_ROOT=1
      WORKDIR /var/www/html
    ports:
      - 80
    working_dir: /var/www/html
    volumes:
      - wordpress-files:/var/www/html
    environment:
      SERVICE_URL_WORDPRESS: ${config.domain}
      WORDPRESS_DB_HOST: mariadb
      WORDPRESS_DB_USER: ${config.service_user_wordpress}
      WORDPRESS_DB_PASSWORD: ${secret.service_password_wordpress}
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_HOME', 'https://${config.domain}' );
        define( 'WP_SITEURL', 'https://${config.domain}' );
        define( 'FORCE_SSL_ADMIN', true );
    depends_on:
      - mariadb
    healthcheck:
      # Probe Apache at the TCP layer so Docker can verify readiness without
      # generating an HTTP access-log entry every interval. WordPress may
      # legitimately return a 3xx redirect before its setup wizard is complete.
      test: ["CMD", "php", "-r", "$socket=@fsockopen(\"127.0.0.1\", 80, $errno, $errstr, 2); if ($socket) { fclose($socket); exit(0); } exit(1);"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 6
  mariadb:
    image: mariadb:11.8.9
    volumes:
      - mariadb-data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=$SERVICE_PASSWORD_ROOT
      - MYSQL_DATABASE=wordpress
      - MYSQL_USER=$SERVICE_USER_WORDPRESS
      - MYSQL_PASSWORD=$SERVICE_PASSWORD_WORDPRESS
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 20s
      retries: 10
