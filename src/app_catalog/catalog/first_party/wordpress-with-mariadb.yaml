# documentation: https://wordpress.org
# slogan: WordPress is open source software you can use to create a beautiful website, blog, or app.
# category: cms
# tags: cms, blog, content, management, mariadb
# logo: svgs/wordpress.svg
# port: 80

x-passdeployer:
  id: wordpress
  name: WordPress
  version: "7.1.2"
  software_version: "7.1.2"
  definition_version: "1.2"
  visibility: public
  featured: true
  features:
    - Managed WordPress application
    - Automatic WordPress installation
    - WP-CLI management
    - Managed MariaDB database
    - Persistent WordPress storage
    - Managed WP-Cron
    - HTTPS platform address
  requirements:
    - WordPress is installed automatically during first startup
    - Use the platform-provided HTTPS address
    - Admin credentials are configured in the Ready App setup
  outputs:
    - url
  managed_components:
    - label: WordPress
      role: application
    - label: MariaDB
      role: database
  fields:
    - id: domain
      label: Platform address
      type: domain
      required: false
      user_editable: false
    - id: software_version
      label: WordPress version
      type: choice
      required: true
      default: "7.1.2"
      options: ["7.1.2", "7.1.1", "7.1.0"]
      option_labels:
        "7.1.2": "7.1.2 — Recommended"
        "7.1.1": "7.1.1 — Previous patch"
        "7.1.0": "7.1.0 — Previous patch"
      ui:
        helper_text: "Choose a pinned official WordPress Docker release."
    - id: php_version
      label: PHP version
      type: choice
      required: true
      default: "8.4"
      options: ["8.3", "8.4", "8.5"]
      option_labels:
        "8.3": "PHP 8.3"
        "8.4": "PHP 8.4 — Recommended"
        "8.5": "PHP 8.5"
    - id: wordpress_site_title
      label: Site title
      type: string
      required: true
      default: "My WordPress Site"
    - id: wordpress_admin_user
      label: Admin username
      type: string
      required: true
      default: admin
      pattern: "^[A-Za-z0-9._-]{1,60}$"
    - id: wordpress_admin_email
      label: Admin email
      type: string
      required: true
      pattern: "^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$"
    - id: wordpress_admin_password
      label: Admin password
      type: secret
      secret: true
      generate: password:32
      required: true
    - id: wordpress_locale
      label: WordPress language
      type: choice
      default: en_US
      options: [en_US, fa_IR, de_DE, tr_TR, ar]
    - id: wordpress_timezone
      label: Timezone
      type: string
      default: UTC
    - id: wordpress_permalink_structure
      label: Permalink structure
      type: choice
      default: "/%postname%/"
      options:
        - "/%postname%/"
        - "/%year%/%monthnum%/%postname%/"
        - "/%category%/%postname%/"
    - id: wordpress_table_prefix
      label: Database table prefix
      type: string
      required: true
      default: wp_
      pattern: "^wp_[A-Za-z0-9_]{0,30}$"
    - id: wordpress_managed_cron
      label: Managed WP-Cron
      type: boolean
      default: true
      ui:
        helper_text: "PassDeployer runs due WP-Cron events inside the managed runtime."
    - id: wordpress_cron_interval
      label: WP-Cron interval (seconds)
      type: integer
      default: 300
      pattern: "^[1-9][0-9]{1,3}$"
    - id: wordpress_replicas
      label: Web replicas
      type: integer
      required: true
      default: 1
      pattern: "^[1-8]$"
      ui:
        helper_text: "CPU/RAM allocation is multiplied per replica. Local persistent storage keeps replicas on its owning Swarm node."
    - id: service_user_wordpress
      label: WordPress database user
      type: string
      default: app
      user_editable: false
    - id: service_password_wordpress
      label: WordPress database password
      type: secret
      secret: true
      generate: password:32
      user_editable: false
    - id: service_password_root
      label: MariaDB root password
      type: secret
      secret: true
      generate: password:32
      user_editable: false

services:
  wordpress:
    image: wordpress:${config.software_version}-php${config.php_version}-apache
    dockerfile: |
      FROM wordpress:${config.software_version}-php${config.php_version}-apache
      ARG WP_CLI_VERSION=2.12.0
      RUN set -eux; \
          apt-get update; \
          apt-get install -y --no-install-recommends ca-certificates curl mariadb-client; \
          curl -fsSL "https://github.com/wp-cli/wp-cli/releases/download/v${WP_CLI_VERSION}/wp-cli-${WP_CLI_VERSION}.phar" -o /usr/local/bin/wp; \
          echo "ce34ddd838f7351d6759068d09793f26755463b4a4610a5a5c0a97b68220d85c  /usr/local/bin/wp" | sha256sum -c -; \
          chmod 0755 /usr/local/bin/wp; \
          wp --info --allow-root; \
          rm -rf /var/lib/apt/lists/*
      COPY passdeployer-wordpress-entrypoint.sh /usr/local/bin/passdeployer-wordpress-entrypoint.sh
      RUN chmod 0755 /usr/local/bin/passdeployer-wordpress-entrypoint.sh
      ENV WP_CLI_ALLOW_ROOT=1
      WORKDIR /var/www/html
      # The official WordPress image exposes docker-ensure-installed.sh as a
      # stable alias for its entrypoint preparation logic. Use that alias as
      # the immutable PID 1 wrapper and pass the PassDeployer bootstrap as CMD.
      # This keeps official WordPress initialization ahead of application setup
      # without making the platform depend on a custom ENTRYPOINT override.
      ENTRYPOINT ["docker-ensure-installed.sh"]
      CMD ["/usr/local/bin/passdeployer-wordpress-entrypoint.sh", "apache2-foreground"]
    files:
      passdeployer-wordpress-entrypoint.sh: |
        #!/bin/sh
        set -eu
        
        APP_ROOT="${WORDPRESS_ROOT:-/var/www/html}"
        READY_MARKER="/tmp/passdeployer-wordpress-ready"
        LOCK_DIR="${APP_ROOT}/.passdeployer-wp-install.lock"
        UPSTREAM_PID=""
        
        log() { echo "[passdeployer-wordpress] $*" >&2; }
        cleanup_lock() { rmdir "$LOCK_DIR" 2>/dev/null || true; }
        
        wait_for_database() {
          attempts=0
          while [ "$attempts" -lt 120 ]; do
            if wp db check --allow-root >/dev/null 2>&1; then return 0; fi
            attempts=$((attempts + 1))
            sleep 1
          done
          return 1
        }
        
        configure_site() {
          wp option update blogname "${WORDPRESS_SITE_TITLE}" --allow-root >/dev/null 2>&1 || true
          wp option update timezone_string "${WORDPRESS_TIMEZONE}" --allow-root >/dev/null 2>&1 || true
          wp option update WPLANG "${WORDPRESS_LOCALE}" --allow-root >/dev/null 2>&1 || true
          wp rewrite structure "${WORDPRESS_PERMALINK_STRUCTURE}" --allow-root >/dev/null 2>&1 || true
          wp rewrite flush --allow-root >/dev/null 2>&1 || true
        }
        
        install_wordpress() {
          if [ "${WORDPRESS_AUTO_INSTALL:-1}" != "1" ]; then
            touch "$READY_MARKER"
            return 0
          fi
        
          if ! wait_for_database; then
            log "ERROR: WordPress database did not become ready within 120 seconds."
            return 1
          fi
        
          if wp core is-installed --allow-root >/dev/null 2>&1; then
            touch "$READY_MARKER"
            log "Existing WordPress installation detected; preserving persistent site settings."
            return 0
          fi
        
          if mkdir "$LOCK_DIR" 2>/dev/null; then
            trap cleanup_lock EXIT INT TERM
            if ! wp core is-installed --allow-root >/dev/null 2>&1; then
              log "Installing WordPress through WP-CLI..."
              if ! wp core install \
                --url="${WORDPRESS_SITE_URL}" \
                --title="${WORDPRESS_SITE_TITLE}" \
                --admin_user="${WORDPRESS_ADMIN_USER}" \
                --admin_password="${WORDPRESS_ADMIN_PASSWORD}" \
                --admin_email="${WORDPRESS_ADMIN_EMAIL}" \
                --locale="${WORDPRESS_LOCALE}" \
                --skip-email \
                --allow-root; then
                log "ERROR: WP-CLI could not complete the initial WordPress installation."
                return 1
              fi
            fi
            configure_site
            touch "$READY_MARKER"
            log "WordPress installation is ready."
            trap - EXIT INT TERM
            cleanup_lock
            return 0
          fi
        
          log "Another replica is completing the WordPress installation; waiting..."
          attempts=0
          while [ "$attempts" -lt 180 ]; do
            if wp core is-installed --allow-root >/dev/null 2>&1; then
              configure_site
              touch "$READY_MARKER"
              return 0
            fi
            attempts=$((attempts + 1))
            sleep 1
          done
          log "ERROR: WordPress installation did not converge."
          return 1
        }
        
        run_managed_cron() {
          [ "${WORDPRESS_MANAGED_CRON:-1}" = "1" ] || return 0
          interval="${WORDPRESS_CRON_INTERVAL:-300}"
          case "$interval" in ''|*[!0-9]*) interval=300 ;; esac
          [ "$interval" -ge 15 ] 2>/dev/null || interval=15
          while [ -n "$UPSTREAM_PID" ] && kill -0 "$UPSTREAM_PID" 2>/dev/null; do
            wp cron event run --due-now --quiet --allow-root >/dev/null 2>&1 || true
            sleep "$interval"
          done
        }
        
        if ! install_wordpress; then
          log "ERROR: automatic WordPress initialization failed."
          exit 1
        fi
        
        if [ "$#" -eq 0 ]; then
          set -- apache2-foreground
        fi
        
        log "Starting WordPress foreground command: $*"
        "$@" &
        UPSTREAM_PID=$!
        
        run_managed_cron &
        wait "$UPSTREAM_PID"
        
    ports:
      - 80
    working_dir: /var/www/html
    # Swarm's ContainerSpec.Command must be deterministic. Mirror the image CMD
    # explicitly so native Swarm execution does not depend on null CMD inheritance.
    command:
      - /usr/local/bin/passdeployer-wordpress-entrypoint.sh
      - apache2-foreground
    replicas: ${config.wordpress_replicas}
    volumes:
      - wordpress-files:/var/www/html
    environment:
      SERVICE_URL_WORDPRESS: ${config.domain}
      WORDPRESS_DB_HOST: mariadb
      WORDPRESS_DB_USER: ${config.service_user_wordpress}
      WORDPRESS_DB_PASSWORD: ${secret.service_password_wordpress}
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_TABLE_PREFIX: ${config.wordpress_table_prefix}
      WORDPRESS_SITE_URL: https://${config.domain}
      WORDPRESS_SITE_TITLE: ${config.wordpress_site_title}
      WORDPRESS_ADMIN_USER: ${config.wordpress_admin_user}
      WORDPRESS_ADMIN_PASSWORD: ${secret.wordpress_admin_password}
      WORDPRESS_ADMIN_EMAIL: ${config.wordpress_admin_email}
      WORDPRESS_LOCALE: ${config.wordpress_locale}
      WORDPRESS_TIMEZONE: ${config.wordpress_timezone}
      WORDPRESS_PERMALINK_STRUCTURE: ${config.wordpress_permalink_structure}
      WORDPRESS_AUTO_INSTALL: "1"
      WORDPRESS_MANAGED_CRON: ${config.wordpress_managed_cron}
      WORDPRESS_CRON_INTERVAL: ${config.wordpress_cron_interval}
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_HOME', 'https://${config.domain}' );
        define( 'WP_SITEURL', 'https://${config.domain}' );
        define( 'FORCE_SSL_ADMIN', true );
        if ( getenv( 'WORDPRESS_MANAGED_CRON' ) === '1' ) { define( 'DISABLE_WP_CRON', true ); }
    depends_on:
      - mariadb
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/passdeployer-wordpress-ready && wp core is-installed --allow-root >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      start_period: 60s
      retries: 36
  mariadb:
    image: mariadb:11.8.9
    volumes:
      - mariadb-data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=$SERVICE_PASSWORD_ROOT
      - MYSQL_DATABASE=wordpress
      - MYSQL_USER=$SERVICE_USER_WORDPRESS
      - MYSQL_PASSWORD=$SERVICE_PASSWORD_WORDPRESS
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 20s
      retries: 10
