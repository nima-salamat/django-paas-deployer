version: '3.8'

services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  deployment-log-db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DEPLOYMENT_LOG_DB_NAME}
      POSTGRES_USER: ${DEPLOYMENT_LOG_DB_USER}
      POSTGRES_PASSWORD: ${DEPLOYMENT_LOG_DB_PASSWORD}
    volumes:
      - deployment_log_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  web:
    build: .
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             python manage.py migrate &&
             python manage.py migrate --database=deployment_logs &&
             daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    volumes:
      - .:/app
      - static_volume:/app/static
      - media_volume:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      deployment-log-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: db
      DEPLOYMENT_LOG_DB_HOST: deployment-log-db
      REDIS_URL: redis://redis:6379
      CHANNEL_REDIS_URL: redis://redis:6379
    networks:
      - app-network

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  celery:
    build: .
    command: celery -A config worker --loglevel=info
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      deployment-log-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: db
      DEPLOYMENT_LOG_DB_HOST: deployment-log-db
      REDIS_URL: redis://redis:6379
      CHANNEL_REDIS_URL: redis://redis:6379
    networks:
      - app-network

  celery-beat:
    build: .
    command: celery -A config beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      deployment-log-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      celery:
        condition: service_started
    env_file:
      - .env
    environment:
      DB_HOST: db
      DEPLOYMENT_LOG_DB_HOST: deployment-log-db
      REDIS_URL: redis://redis:6379
      CHANNEL_REDIS_URL: redis://redis:6379
    networks:
      - app-network

  nginx:
    container_name: nginx_deployer
    image: nginx:latest
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - static_volume:/usr/share/nginx/html/static
      - media_volume:/usr/share/nginx/html/media
      - ./config/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    networks:
      - app-network

volumes:
  postgres_data:
  deployment_log_data:
  static_volume:
  media_volume:

networks:
  app-network:
    driver: bridge
