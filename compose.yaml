services:

  # ============================================================
  # TRAEFIK
  # ============================================================
  traefik:
    image: ${DOCKER_MIRROR:-docker.io}/traefik:v3.6

    container_name: deploy-traefik
    restart: unless-stopped

    command:
      # ----------------------------------------------------------
      # Docker provider
      # ----------------------------------------------------------
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=proxy_net
      - --providers.docker.endpoint=unix:///var/run/docker.sock

      # ----------------------------------------------------------
      # HTTP entrypoint
      #
      # Host Nginx -> 127.0.0.1:8021 -> Traefik:80
      #
      # SSL is terminated by host Nginx.
      # ----------------------------------------------------------
      - --entrypoints.web.address=:80

      # ----------------------------------------------------------
      # Logs
      # ----------------------------------------------------------
      - --log.level=INFO
      - --accesslog=true

    ports:
      # Traefik is NOT publicly exposed.
      # Only host Nginx can access it.
      - "127.0.0.1:8021:80"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

    networks:
      - proxy_net


  # ============================================================
  # MAIN POSTGRES DATABASE
  # ============================================================
  db:
    image: ${DOCKER_MIRROR:-docker.io}/postgres:15

    container_name: deploy-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - app-network


  # ============================================================
  # REDIS
  # ============================================================
  redis:
    image: ${DOCKER_MIRROR:-docker.io}/redis:7

    container_name: deploy-redis
    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - "yes"

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

    networks:
      - app-network


  # ============================================================
  # DJANGO / DAPHNE
  # ============================================================
  web:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: deploy-web
    restart: unless-stopped

    command:
      - sh
      - -c
      - |
        set -e

        echo "=========================================="
        echo "Running collectstatic..."
        echo "=========================================="

        python manage.py collectstatic --noinput

        echo "=========================================="
        echo "Running main database migrations..."
        echo "=========================================="

        python manage.py migrate

        echo "=========================================="
        echo "Running deployment_logs migrations..."
        echo "=========================================="

        python manage.py migrate --database=deployment_logs

        echo "=========================================="
        echo "Starting Daphne..."
        echo "=========================================="

        exec daphne \
          -b 0.0.0.0 \
          -p 8000 \
          asgi:application

    volumes:
      - .:/app
      - ./staticfiles:/app/staticfiles
      - ./media:/app/media

      # Required because the deployer creates/manages Docker containers.
      - /var/run/docker.sock:/var/run/docker.sock

    ports:
      # Host Nginx -> Django
      #
      # Django is NOT publicly exposed.
      - "127.0.0.1:8020:8000"

    depends_on:
      db:
        condition: service_healthy

      redis:
        condition: service_healthy

    env_file:
      - .env

    environment:
      # ----------------------------------------------------------
      # PostgreSQL
      # ----------------------------------------------------------
      DB_HOST: db
      DB_PORT: 5432

      # ----------------------------------------------------------
      # Redis
      # ----------------------------------------------------------
      REDIS_URL: redis://redis:6379
      CHANNEL_REDIS_URL: redis://redis:6379

      # ----------------------------------------------------------
      # Domains
      # ----------------------------------------------------------
      API_DOMAIN_NAME: ${API_DOMAIN_NAME}
      DEPLOYMENT_DOMAIN: ${DEPLOYMENT_DOMAIN}

    # ==========================================================
    # WEB HEALTHCHECK
    #
    # This checks that Daphne is actually listening on port 8000.
    #
    # We intentionally use Python instead of curl/wget so that
    # the healthcheck does not depend on those packages existing
    # inside the Docker image.
    # ==========================================================
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1',8000)); s.close()"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - app-network
      - proxy_net


  # ============================================================
  # CELERY WORKER
  # ============================================================
  celery:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: deploy-celery
    restart: unless-stopped

    command:
      - celery
      - -A
      - config
      - worker
      - --loglevel=info

    volumes:
      - .:/app

      # Required for deployment/build tasks that use Docker.
      - /var/run/docker.sock:/var/run/docker.sock

    depends_on:
      # ----------------------------------------------------------
      # Celery MUST NOT start before Django is healthy.
      # ----------------------------------------------------------
      web:
        condition: service_healthy

      db:
        condition: service_healthy

      redis:
        condition: service_healthy

    env_file:
      - .env

    environment:
      # ----------------------------------------------------------
      # PostgreSQL
      # ----------------------------------------------------------
      DB_HOST: db
      DB_PORT: 5432

      # ----------------------------------------------------------
      # Redis
      # ----------------------------------------------------------
      REDIS_URL: redis://redis:6379
      CHANNEL_REDIS_URL: redis://redis:6379

      # ----------------------------------------------------------
      # Domains
      # ----------------------------------------------------------
      API_DOMAIN_NAME: ${API_DOMAIN_NAME}
      DEPLOYMENT_DOMAIN: ${DEPLOYMENT_DOMAIN}

    networks:
      - app-network
      - proxy_net


  # ============================================================
  # CELERY BEAT
  # ============================================================
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: deploy-celery-beat
    restart: unless-stopped

    command:
      - celery
      - -A
      - config
      - beat
      - --loglevel=info
      - --scheduler=django_celery_beat.schedulers:DatabaseScheduler

    volumes:
      - .:/app

    depends_on:
      # ----------------------------------------------------------
      # Beat MUST NOT start before Django is healthy.
      # ----------------------------------------------------------
      web:
        condition: service_healthy

      # ----------------------------------------------------------
      # Beat also waits until the Celery worker container has
      # actually been started.
      # ----------------------------------------------------------
      celery:
        condition: service_started

      db:
        condition: service_healthy

      redis:
        condition: service_healthy

    env_file:
      - .env

    environment:
      # ----------------------------------------------------------
      # PostgreSQL
      # ----------------------------------------------------------
      DB_HOST: db
      DB_PORT: 5432

      # ----------------------------------------------------------
      # Redis
      # ----------------------------------------------------------
      REDIS_URL: redis://redis:6379
      CHANNEL_REDIS_URL: redis://redis:6379

      # ----------------------------------------------------------
      # Domains
      # ----------------------------------------------------------
      API_DOMAIN_NAME: ${API_DOMAIN_NAME}
      DEPLOYMENT_DOMAIN: ${DEPLOYMENT_DOMAIN}

    networks:
      - app-network
      - proxy_net


# ==============================================================
# VOLUMES
# ==============================================================
volumes:
  postgres_data:
  redis_data:


# ==============================================================
# NETWORKS
# ==============================================================
networks:

  # ------------------------------------------------------------
  # Internal Django application network
  # ------------------------------------------------------------
  app-network:
    name: deploy_app_network
    driver: bridge

  # ------------------------------------------------------------
  # Traefik + dynamically-created deployment containers
  # ------------------------------------------------------------
  proxy_net:
    name: proxy_net
    driver: bridge
